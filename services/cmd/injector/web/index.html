<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voltera · Injector</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1c2330;--mut:#6b7585;--line:#e1e5eb;--acc:#2563eb;--ok:#15803d;--bad:#b91c1c;--warn:#b45309}
@media (prefers-color-scheme:dark){:root{--bg:#0f141b;--card:#171e28;--fg:#e6eaf0;--mut:#8b96a8;--line:#273040;--acc:#60a5fa;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:18px;margin:0}
.pill{padding:2px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mut);font-size:12px}
.pill.running{color:var(--acc);border-color:var(--acc)}.pill.done{color:var(--ok);border-color:var(--ok)}
.pill.error{color:var(--bad);border-color:var(--bad)}.pill.stopped{color:var(--warn);border-color:var(--warn)}
.grid{display:grid;grid-template-columns:320px 1fr;gap:12px}
@media (max-width:800px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:0 0 10px}
label{display:block;font-size:12px;color:var(--mut);margin-top:8px}
input,select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hidden{display:none}
.desc{font-size:12px;color:var(--mut);margin:6px 0 0}
.btns{display:flex;gap:8px;margin-top:14px}
button{flex:1;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;cursor:pointer}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.stat .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}.stat .k{font-size:12px;color:var(--mut)}
#chart{width:100%;height:150px;display:block}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 0}.bar>i{display:block;height:100%;background:var(--acc);width:0}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
code{font:12px ui-monospace,monospace}
.err{color:var(--bad);font-size:12px;margin-top:8px}
.tr{display:flex;gap:8px;align-items:center;margin:2px 0}.tr button{flex:none;padding:1px 8px;font-size:11px}
</style>
</head>
<body>
<main>
<header>
  <h1>Voltera · Injector</h1>
  <span class="pill" id="region">región …</span>
  <span class="pill" id="state">idle</span>
</header>
<div class="grid">
  <section class="card">
    <h2>Escenario</h2>
    <select id="scenario"></select>
    <p class="desc" id="desc"></p>
    <div class="row">
      <div data-f="n"><label>Mensajes (n)</label><input id="n" type="number" min="0"></div>
      <div data-f="duration"><label>Duración (s)</label><input id="duration" type="number" min="0"></div>
      <div data-f="rate"><label id="rateLbl">Rate (msg/s)</label><input id="rate" type="number" min="1"></div>
      <div data-f="rate_to"><label>Rate final</label><input id="rate_to" type="number" min="1"></div>
      <div data-f="burst"><label>Ráfaga (msgs)</label><input id="burst" type="number" min="1"></div>
      <div data-f="every"><label>Cada (s)</label><input id="every" type="number" min="1" step="any"></div>
      <div data-f="meters"><label>Medidores</label><input id="meters" type="number" min="1"></div>
      <div data-f="foreign"><label>Foráneos (0–1)</label><input id="foreign" type="number" min="0" max="1" step="0.05"></div>
    </div>
    <div class="btns"><button class="primary" id="start">Iniciar</button><button id="stop" disabled>Detener</button></div>
    <div class="err" id="err"></div>
  </section>
  <section>
    <div class="stats card">
      <div class="stat"><div class="v" id="sent">0</div><div class="k">enviados</div></div>
      <div class="stat"><div class="v" id="errors">0</div><div class="k">errores</div></div>
      <div class="stat"><div class="v" id="rr">0</div><div class="k">msg/s reales</div></div>
      <div class="stat"><div class="v" id="p95">–</div><div class="k">publish p50 / p95 ms</div></div>
      <div class="stat"><div class="v" id="fg">0</div><div class="k">foráneos (→ Knative)</div></div>
      <div class="stat"><div class="v" id="el">0s</div><div class="k">transcurrido</div></div>
    </div>
    <div class="card" style="margin-bottom:12px">
      <h2>Throughput (msg/s)</h2>
      <svg id="chart" viewBox="0 0 600 150" preserveAspectRatio="none"></svg>
      <div class="bar"><i id="prog"></i></div>
    </div>
    <div class="card" style="margin-bottom:12px">
      <h2>Trace IDs (App Insights → operation_Id)</h2>
      <div id="traces"><span class="desc">Sin trazas aún.</span></div>
    </div>
    <div class="card">
      <h2>Historial</h2>
      <table><thead><tr><th>Inicio</th><th>Escenario</th><th>Enviados</th><th>Err</th><th>Foráneos</th><th>Duración</th><th>Estado</th></tr></thead><tbody id="hist"></tbody></table>
    </div>
  </section>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
const FIELDS={constante:['n','rate','meters','foreign'],rampa:['duration','rate','rate_to','meters','foreign'],
  rafaga:['duration','n','burst','every','meters','foreign'],'cruce-knative':['n','duration','rate','meters','foreign'],
  soak:['duration','rate','meters','foreign']};
const NUM=['n','duration','rate','rate_to','burst','every','meters','foreign'];
let presets=[];

function fmtT(s){s=Math.round(s);return s>=60?Math.floor(s/60)+'m '+(s%60)+'s':s+'s'}
function applyPreset(){
  const p=presets.find(x=>x.name===$('scenario').value);if(!p)return;
  $('desc').textContent=p.description;
  NUM.forEach(k=>$(k).value=p.params[k]||'');
  const show=FIELDS[p.name]||[];
  document.querySelectorAll('[data-f]').forEach(d=>d.classList.toggle('hidden',!show.includes(d.dataset.f)));
  $('rateLbl').textContent=p.name==='rampa'?'Rate inicial':'Rate (msg/s)';
}
async function start(){
  $('err').textContent='';
  const body={scenario:$('scenario').value};
  NUM.forEach(k=>{if(!$(k).closest('[data-f]').classList.contains('hidden')&&$(k).value!=='')body[k]=Number($(k).value)});
  const r=await fetch('api/run',{method:'POST',body:JSON.stringify(body)});
  if(!r.ok)$('err').textContent=(await r.text()).trim();
  poll();
}
async function stop(){await fetch('api/stop',{method:'POST'});poll()}
function chart(series){
  const w=600,h=150,n=Math.max(series.length,2),mx=Math.max(1,...series)*1.15;
  const pts=series.map((v,i)=>[i/(n-1)*w,h-v/mx*h]);
  const line=pts.map(p=>p.join(',')).join(' ');
  $('chart').innerHTML=pts.length?`<polygon points="0,${h} ${line} ${pts[pts.length-1][0]},${h}" fill="var(--acc)" opacity=".15"/>
    <polyline points="${line}" fill="none" stroke="var(--acc)" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <text x="4" y="12" fill="var(--mut)" font-size="11">máx ${Math.round(mx/1.15)}</text>`:'';
}
function render(d){
  const c=d.current,run=c.state==='running';
  $('region').textContent='región '+d.region;
  $('state').textContent=c.state;$('state').className='pill '+c.state;
  $('sent').textContent=c.sent;$('errors').textContent=c.errors;
  $('rr').textContent=c.real_rate.toFixed(1);
  $('p95').textContent=c.sent?c.p50_ms.toFixed(1)+' / '+c.p95_ms.toFixed(1):'–';
  $('fg').textContent=c.foreign;$('el').textContent=fmtT(c.elapsed_sec);
  $('start').disabled=run;$('stop').disabled=!run;
  const p=c.params||{};
  let pct=0;if(p.n>0)pct=c.sent/p.n;if(p.duration>0)pct=Math.max(pct,c.elapsed_sec/p.duration);
  $('prog').style.width=Math.min(100,pct*100)+'%';
  if(c.last_error&&!$('err').textContent)$('err').textContent='último error: '+c.last_error;
  chart(c.series||[]);
  $('traces').innerHTML=(c.traces||[]).map(t=>`<div class="tr"><code>${t}</code><button onclick="navigator.clipboard.writeText('${t}')">copiar</button></div>`).join('')||'<span class="desc">Sin trazas aún.</span>';
  $('hist').innerHTML=d.history.map(h=>`<tr><td>${new Date(h.started_at).toLocaleTimeString()}</td><td>${h.params.scenario}</td><td>${h.sent}</td><td>${h.errors}</td><td>${h.foreign}</td><td>${fmtT(h.elapsed_sec)}</td><td>${h.state}</td></tr>`).join('');
}
async function poll(){
  try{render(await (await fetch('api/status')).json())}catch(e){$('state').textContent='sin conexión'}
}
(async()=>{
  const d=await (await fetch('api/scenarios')).json();presets=d.presets;
  $('scenario').innerHTML=presets.map(p=>`<option>${p.name}</option>`).join('');
  $('scenario').onchange=applyPreset;applyPreset();
  $('start').onclick=start;$('stop').onclick=stop;
  poll();setInterval(poll,1000);
})();
</script>
</body>
</html>
