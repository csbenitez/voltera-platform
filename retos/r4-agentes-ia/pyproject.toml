[project]
name = "voltera-copiloto"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mcp>=1.2,<2", "httpx>=0.27", "psycopg[binary]>=3.2"]

[project.optional-dependencies]
serve = [
  "langgraph>=0.2",
  "langchain>=0.3",
  "langchain-mcp-adapters>=0.1",
  "langchain-google-genai",
  "langchain-groq",
  "langchain-openai",
  "langchain-anthropic",
  "langgraph-checkpoint-postgres",
  "fastembed>=0.4",
  "chainlit>=2",
]
dev = ["pytest>=8", "respx>=0.21"]

[tool.setuptools]
packages = ["mcp_server", "copiloto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
