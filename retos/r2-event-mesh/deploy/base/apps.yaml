# Pipeline regional (idéntica en on-prem y nube). Imagen única 'voltera-eda' (kustomize images).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: declaration-gateway
  labels: {app: declaration-gateway, app.kubernetes.io/part-of: voltera-eda}
spec:
  replicas: 0   # lo gestiona KEDA (0..5)
  selector:
    matchLabels: {app: declaration-gateway}
  template:
    metadata:
      labels: {app: declaration-gateway, app.kubernetes.io/part-of: voltera-eda}
    spec:
      containers:
        - name: declaration-gateway
          image: voltera-eda
          imagePullPolicy: IfNotPresent
          command: ["/svc/declaration-gateway"]
          envFrom:
            - configMapRef: {name: voltera-config}
          ports:
            - {containerPort: 8080, name: http}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: declaration-gateway
spec:
  selector: {app: declaration-gateway}
  ports:
    - {name: http, port: 80, targetPort: http}
