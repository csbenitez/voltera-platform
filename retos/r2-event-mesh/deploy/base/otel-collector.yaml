# OpenTelemetry Collector por región -> Azure Application Insights.
# Basado en la config FinOps de feat/event-mesh (filtro de health checks + batch).
# Requiere el Secret appinsights-secret (scripts/lab.ps1 secrets).
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-conf
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:
        send_batch_size: 100
        timeout: 3s
      filter/finops:
        error_mode: ignore
        traces:
          span:
            - 'IsMatch(name, ".*(healthz|readyz|livez|metrics).*")'
    exporters:
      azuremonitor:
        connection_string: "${env:APPLICATIONINSIGHTS_CONNECTION_STRING}"
      debug:
        verbosity: basic
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [filter/finops, batch]
          exporters: [azuremonitor, debug]
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
spec:
  selector: {app: otel-collector}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: 4317}
    - {name: otlp-http, port: 4318, targetPort: 4318}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels: {app: otel-collector}
  template:
    metadata:
      labels: {app: otel-collector}
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.111.0
          args: ["--config=/etc/otelcol-contrib/collector.yaml"]
          env:
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom:
                secretKeyRef: {name: appinsights-secret, key: connection-string}
          ports:
            - {containerPort: 4317, name: otlp-grpc}
            - {containerPort: 4318, name: otlp-http}
          resources:
            requests: {cpu: 15m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/otelcol-contrib}
      volumes:
        - name: config
          configMap: {name: otel-collector-conf}
